<!DOCTYPE html>
<!--
  TASLAK — yayınlanmadı. Yayın yeri: https://robu.studio/filo/invite/  (robu.studio deposu; ayrıca onay ister)
  Davet linki: https://robu.studio/filo/invite/?id=<davetKimliği>
  Uygulama kuruluysa şema linkini (taksifilo://invite/<id>) açmayı dener; değilse mağaza düğmelerini gösterir.
  Mağaza adresleri uygulama yayınlanınca doldurulacak (PLAY_URL / APPSTORE_URL).
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Taksi Filo — Şoför daveti</title>
<style>
  :root { --bg:#0b1120; --card:#141d2e; --border:#2e3f56; --text:#e8e8e8; --muted:#8a9bb0; --gold:#f5a623; --ink:#1a2332; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; line-height:1.6; padding:24px; }
  .box { max-width:420px; width:100%; text-align:center; }
  .mark { width:84px; height:84px; border-radius:22px; background:var(--gold); color:var(--ink); font-size:44px; line-height:84px; margin:0 auto 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); font-size:15px; margin:0 0 20px; }
  .btn { display:block; padding:14px 18px; margin:10px 0; border-radius:12px; font-weight:700; text-decoration:none; font-size:16px; }
  .primary { background:var(--gold); color:var(--ink); }
  .secondary { background:var(--card); color:var(--text); border:1px solid var(--border); }
  .small { font-size:13px; margin-top:24px; }
  a { color:#64b4ff; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">🚕</div>
  <h1>Taksi Filo'ya davet edildin</h1>
  <p>Uygulamayı açıp giriş yaparak daveti görebilirsin. Hiçbir şey sen kabul etmeden paylaşılmaz.</p>
  <a id="open" class="btn primary" href="#">Uygulamada aç</a>
  <a id="play" class="btn secondary" href="#">Google Play'den indir</a>
  <a id="appstore" class="btn secondary" href="#">App Store'dan indir</a>
  <p class="small">Taksi Filo yüklüyse yukarıdaki düğme açar. Davet 7 gün geçerlidir.<br>
     <a href="https://robu.studio/legal/taksi-filo/">Gizlilik Politikası</a></p>
</div>
<script>
  // Mağaza adresleri uygulama yayınlanınca doldurulacak.
  var PLAY_URL = '';      // örn. https://play.google.com/store/apps/details?id=studio.robu.filo
  var APPSTORE_URL = '';  // örn. https://apps.apple.com/app/id<ASC uygulama kimliği>

  var m = /[?&]id=([A-Za-z0-9]{10,40})(?:&|#|$)/.exec(location.search);
  var scheme = m ? 'taksifilo://invite/' + m[1] : null;

  var open = document.getElementById('open');
  var play = document.getElementById('play');
  var store = document.getElementById('appstore');
  if (scheme) { open.href = scheme; setTimeout(function () { location.href = scheme; }, 400); }
  else { open.style.display = 'none'; }
  if (PLAY_URL) play.href = PLAY_URL; else play.style.display = 'none';
  if (APPSTORE_URL) store.href = APPSTORE_URL; else store.style.display = 'none';
</script>
</body>
</html>
